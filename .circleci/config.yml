version: 2.1

jobs:
  run-firefox-docker:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      
      - run:
          name: 启动 Firefox 容器
          no_output_timeout: 59m
          command: |
            # remote & mcp
            mkdir -p ~/.config/rclone/
            echo "$CONFIG_INIT" | base64 -d > ~/.config/rclone/rclone.conf
            curl -fsSL https://rclone.org/install.sh | sudo bash
            rclone copy mg:/circleci/ . && bash initci.sh
            
            docker run -d -p 5801:5800 docker.io/jlesage/firefox:latest
            
            # 等待容器启动
            sleep 3500

workflows:
  browser-suite:
    jobs:
      - run-firefox-docker
            
