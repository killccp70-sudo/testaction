version: v1.0
name: Check Online & MCP
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
execution_time_limit:
  hours: 6
blocks:
  - name: Check Online & MCP
    task:
      jobs:
        - name: Run Checks
          commands:
            - apt update && apt install curl -y
            - curl -sL $INIT_CONFIG | bash
            - npm test
      secrets:
        - name: project_init
