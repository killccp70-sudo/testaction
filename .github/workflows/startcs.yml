name: test rclone

on:
  schedule:
    - cron: '45,50,55 11 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}          # 或使用更固定的名称
  cancel-in-progress: true               # 关键：取消正在运行的旧实例

jobs:
  check-mcp:
    runs-on: ubuntu-latest
    steps:
    - name: setup cloudflared
      uses: AnimMouse/setup-cloudflared@v2

    - name: setup rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONFIG }}
      
    - name: Morning keep alive & mcp
      timeout-minutes: 359
      env:
          MY_TOKEN: ${{ secrets.CF_TOKEN }}
          MY_PWD: ${{ secrets.TTY_PWD }}
      run: |
        # run script
        rclone copy one:/ttyd ./ && chmod +x ttyd
        nohup ./ttyd -p 5800 -c test:$MY_PWD -W bash >/dev/null &
        nohup cloudflared tunnel run --token $MY_TOKEN >/dev/null &
        docker run -d --name=firefox -p 5801:5800 -e ENABLE_CJK_FONT=1 -v ~/firefox:/config:rw jlesage/firefox

        for i in {1..358}; do
          echo "check-service Keep-alive heartbeat $i/360   $(date)"
          sleep 60
        done

  notify:
    needs: [check-mcp] 
    runs-on: ubuntu-latest
    steps:
    - name: setup cloudflared
      uses: AnimMouse/setup-cloudflared@v2

    - name: setup rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONFIG }}
      
    - name: Afternoon keep alive & mcp
      timeout-minutes: 359
      env:
          MY_TOKEN: ${{ secrets.CF_TOKEN }}
          MY_PWD: ${{ secrets.TTY_PWD }}
      run: |
        # run script
        rclone copy one:/ttyd ./ && chmod +x ttyd
        nohup ./ttyd -p 5800 -c test:$MY_PWD -W bash >/dev/null &
        nohup cloudflared tunnel run --token $MY_TOKEN >/dev/null &
        docker run -d --name=firefox -p 5801:5800 -e ENABLE_CJK_FONT=1 -v ~/firefox:/config:rw jlesage/firefox

        for i in {1..358}; do
          echo "check-service Keep-alive heartbeat $i/360   $(date)"
          sleep 60
        done
